# 4x4x4 folded 3D array (3D-MIND design, Kumar et al. 2026) recorded on an MCS MEA2100-Mini.
# Grid indices come from MEA_CUBE in the legacy mcs.py; they encode how the headstage channels are
# wired to the electrodes of the folded array (confirmed by the owner, 2026-10-03).
# Positions: x = (col - 1) * pitch_col_um, y = (row - 1) * pitch_row_um, z = (layer - 1) * layer_spacing_um.
name: cube4x4x4_E-00303
description: Custom 4x4x4 3D MEA, device E-00303, 59 recording contacts on a 64-cell grid
ndim: 3
map_file: cube4x4x4_E-00303_map.csv
# Dimensions from Kumar et al. 2026 (Nat. Electron. 9:532), the same 3D-MIND design (owner, 2026-10-05):
#   - sensors are 30 um gold discs;
#   - layers are separated by the SU-8 spacer, spun 250 um thick in the fabrication recipe;
#   - layer 1 is the bottom layer (confirmed by the owner); sensors in different layers stack in x-y.
# The in-layer sensor pitch is NOT given in the paper's main text (only the layer size, 5 x 6.3 mm, and
# the scaffold ribbons: 25 um wide, 50 um / 75 um gaps). It stays a placeholder until supplied (Q1), so
# geometry_verified stays false: z distances are physical, x-y distances are not.
pitch_row_um: 100.0  # PLACEHOLDER
pitch_col_um: 100.0  # PLACEHOLDER
layer_spacing_um: 250.0  # Kumar et al. 2026, spacer SU-8 thickness
contact_radius_um: 15.0  # Kumar et al. 2026: 30 um diameter sensors
reference_labels: ["15"]  # reference electrode (confirmed by the owner, 2026-10-03)
geometry_verified: false
notes: >-
  Layer 1 is the bottom layer (owner, 2026-10-05); contacts assumed to face +z. Layer spacing and
  sensor diameter from Kumar et al. 2026; in-layer pitch is a placeholder.
  Cells (row, col, layer) (1,2,4), (1,3,4), (1,4,4), (4,3,4), (4,4,4) have no recorded contact.
